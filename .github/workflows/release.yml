name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  goreleaser:
    permissions:
      contents: write
      packages: write
      id-token: write # Required for OIDC signing (Cosign)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.24.x'

      - name: Install Cosign
        uses: sigstore/cosign-installer@59acb623e2b699277a83530009de973714f9d557 # v3.5.0

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@61117185cc6b5302c34be5cf6f2eeec8dfd2c4e1 # v0.16.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@57ed77ae391eb1590fc5f407c68284abd9f4f13a # v5.0.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

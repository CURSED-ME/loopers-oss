name: Pricing Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'pricing.yaml'
      - 'cmd/pricing-validator/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'pricing.yaml'
      - 'cmd/pricing-validator/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate pricing.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run Pricing Validator
        run: go run cmd/pricing-validator/main.go pricing.yaml

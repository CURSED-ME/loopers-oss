name: Pricing Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'pricing.yaml'
      - 'cmd/pricing-validator/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'pricing.yaml'
      - 'cmd/pricing-validator/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate pricing.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.26.x'
          cache: true

      - name: Run Pricing Validator
        run: go run cmd/pricing-validator/main.go pricing.yaml

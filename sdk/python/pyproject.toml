[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopers-client"
version = "2.0.3"
description = "A premium Python client wrapper for the Loopers AI budget & rate-limit proxy."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.20.0",
    "PyJWT>=2.8.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.3.0"]
langchain = ["langchain-openai>=0.1.0"]
llama_index = ["llama-index-llms-openai>=0.1.0"]
crewai = ["crewai>=0.28.8"]
autogen = ["pyautogen>=0.2.20"]
dev = ["pytest", "pytest-asyncio", "respx", "openai>=1.0.0", "anthropic>=0.3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["loopers_client*"]

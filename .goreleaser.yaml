# .goreleaser.yaml
# Verification documentation: https://goreleaser.com

version: 2

project_name: loopers

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    main: ./cmd/loopers
    binary: loopers
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - format: tar.gz
    # this name template makes the archives compatible with godownloader
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

dockers:
  - image_templates:
      - "ghcr.io/cursed-me/loopers:{{ .Tag }}-amd64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    extra_files:
      - pricing.yaml
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .Commit }}"
  - image_templates:
      - "ghcr.io/cursed-me/loopers:{{ .Tag }}-arm64"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    extra_files:
      - pricing.yaml
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: "ghcr.io/cursed-me/loopers:{{ .Tag }}"
    image_templates:
      - "ghcr.io/cursed-me/loopers:{{ .Tag }}-amd64"
      - "ghcr.io/cursed-me/loopers:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/cursed-me/loopers:latest"
    image_templates:
      - "ghcr.io/cursed-me/loopers:{{ .Tag }}-amd64"
      - "ghcr.io/cursed-me/loopers:{{ .Tag }}-arm64"

# Homebrew tap publishing is enabled.
brews:
  - name: loopers
    repository:
      owner: CURSED-ME
      name: homebrew-tap
    directory: Formula
    homepage: "https://tryloopers.com"
    description: "The Circuit Breaker for AI API Billing"
    license: "MIT"
    install: |
      bin.install "loopers"

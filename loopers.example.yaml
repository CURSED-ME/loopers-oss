server:
  port: 8080
redis:
  addr: "localhost:6379"
  password: ""
  db: 0
log:
  level: "info"
pricing_path: "./pricing.yaml"

alerting:
  # Loopers always emits structured security events to stdout.
  # Set webhook_url to additionally POST events to a webhook endpoint.
  webhook_url: "https://example.com/webhook"
  thresholds:
    - percent: 50
      message: "Budget 50% consumed"
    - percent: 80
      message: "Budget 80% consumed — approaching limit"
    - percent: 95
      message: "Budget 95% consumed — imminent cutoff"

loop_detection:
  enabled: true
  fingerprint:
    threshold: 3
    # Default 60s catches rapid HFT-style agents. Consider 300s for slower, low-frequency agents.
    window_seconds: 60
  velocity:
    max_rps: 0             # disabled by default; set e.g. 10.0 to enable
    max_endpoint_repeats: 0
    repeat_window_seconds: 30
  stall:
    min_hamming_distance: 0  # disabled by default
    low_diversity_threshold: 5
    action: "warn"           # V1 default: warn only, does not block request

otel:
  # Export traces to an OTel Collector or compatible backend
  enabled: false
  # Standard OTLP endpoint (e.g. localhost:4317 for gRPC, localhost:4318 for HTTP)
  endpoint: "localhost:4317"
  # Protocol: grpc or http
  protocol: "grpc"
  insecure: true
  # Probabilistic sampling rate for successful requests (0.0 to 1.0).
  # 1.0 = trace all requests. 0.1 = trace 10%.
  # Note: Security enforcement events (blocks, warnings, auth failures) are ALWAYS traced regardless of this setting.
  sampling_rate: 1.0
  # headers:
  #   "x-honeycomb-team": "your-api-key"

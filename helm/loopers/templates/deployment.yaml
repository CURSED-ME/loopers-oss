apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loopers.fullname" . }}
  labels:
    {{- include "loopers.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "loopers.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "loopers.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config-volume
              mountPath: /app/loopers.yaml
              subPath: loopers.yaml
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "loopers.fullname" . }}-config
